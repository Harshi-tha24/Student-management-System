<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Edit Student</h1>

<form method="POST">

    <label>Name:</label>
    <input type="text" name="name" value="{{ student[1] }}" required>

    <br><br>

    <label>Branch:</label>
    <input type="text" name="branch" value="{{ student[2] }}" required>

    <br><br>

    <label>CGPA:</label>
    <input type="number" step="0.01" name="cgpa" value="{{ student[3] }}" required>

    <br><br>

    <button type="submit">Update Student</button>

</form>

<br>

<a href="/">Back to Home</a>

</body>
</html>
